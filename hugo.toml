baseURL = 'https://ambisonics.ch/'
locale = 'en-US'
title = 'ICST Ambisonics'
theme = 'anatole'
enableEmoji = true
buildFuture = false
cleanDestinationDir = true
defaultContentLanguage = 'en'

[languages]
  [languages.en]
    label = "EN"
    weight = 1
  [languages.de]
    label = "DE"
    weight = 2
    [languages.de.menu]
      [[languages.de.menu.footer]]
      name = "Datenschutzerklaerung"
      weight = 1
      identifier = "Privacy Policy"
      url = "/privacy-policy/"

      [[languages.de.menu.footer]]
      name = "Cookie-Richtlinie"
      weight = 2
      identifier = "Cookie Policy"
      url = "https://www.iubenda.com/privacy-policy/70769495/cookie-policy"

      [[languages.de.menu.footer]]
      name = "Allgemeine Geschaeftsbedingungen"
      weight = 3
      identifier = "Terms and Conditions"
      url = "/terms-and-conditions/"

[params]
title = "ICST Ambisonics"
authorName = "Johannes Schuett"
email = "johannes.schuett@zhdk.ch"
rssFullContent = true
singleDateFormat = "2006-01-02"
description = "Free VST3/AU/LV2 ambisonics plugins for REAPER, open-source Max/MSP externals for spatial audio, and an artist residency programme. ICST / ZHdK Zurich."
descriptionattribution = "by ICST / Zurich University of the Arts"
descriptionattributionurl = "https://www.zhdk.ch/forschung/icst"
descriptionLines = [
  "Free ambisonics plugins for REAPER,",
  "a spatial composition guide,",
  "and artist residencies."
]
descriptionAttributionLines = ["ICST / Zurich University of the Arts"]
profilePicture = "images/AmbiPlugin_logo.gif"
# Default Open Graph / social sharing image (1200×630+ recommended)
images = ["images/composing_in_ambisonics.png"]
mainSections = ["blog", "post"]
favicon = "favicons/"
contentratio = 0.82
copyright = ""
# Google Search Console verification
googleSiteVerify = "2dac45051b431b1b"

  [params.mermaid]
  enable = true

  [params.author]
  name  = "Johannes Schuett"
  email = "johannes.schuett@zhdk.ch"

[markup.goldmark.renderer]
unsafe = true
ignoreLogs = ["warning-goldmark-raw-html"]

[markup.tableOfContents]
startLevel = 2
endLevel = 3
ordered = false

