baseURL = 'https://ambisonics.ch/'
languageCode = 'en-us'
title = 'The ICST Ambisonics Site'
theme = 'anatole'
enableEmoji = true
buildFuture = true
defaultContentLanguage = 'en'

[languages]
  [languages.en]
    languageName = "English"
    weight = 1
  [languages.de]
    languageName = "Deutsch"
    weight = 2

[params]
title = "ICST Ambisonics"
authorName = "Johannes Schuett"
email = "johannes.schuett@zhdk.ch"
rssFullContent = true
singleDateFormat = "2006-01-02"
description = "Spatial Audio Plugins & Tutorials\nby ICST · Zurich University of the Arts"
profilePicture = "images/AmbiPlugin_logo.gif"
mainSections = ["blog", "post"]
favicon = "favicons/"
contentratio = 0.7
copyright = ""

  [params.author]
  name  = "Johannes Schuett"
  email = "johannes.schuett@zhdk.ch"

[markup.goldmark.renderer]
unsafe = true
ignoreLogs = ["warning-goldmark-raw-html"]

