baseURL = 'https://ambisonics.ch/'
locale = 'en-US'
title = 'ICST Ambisonics'
theme = 'anatole'
enableEmoji = true
buildFuture = false
cleanDestinationDir = true
defaultContentLanguage = 'en'

[languages]
  [languages.en]
    label = "EN"
    weight = 1
  [languages.de]
    label = "DE"
    weight = 2

[params]
disableTitleCapitalization = true
title = "ICST Ambisonics"
authorName = "Johannes Schuett"
email = "johannes.schuett@zhdk.ch"
rssFullContent = true
singleDateFormat = "2006-01-02"
description = "Free VST3/AU/LV2 ambisonics plugins for REAPER, open-source Max/MSP externals for spatial audio, and an artist residency programme. ICST / ZHdK Zurich."
descriptionattribution = "by ICST / Zurich University of the Arts"
descriptionattributionurl = "https://www.zhdk.ch/forschung/icst"
descriptionLines = [
  "Free ambisonics plugins for REAPER,",
  "a spatial composition guide,",
  "and artist residencies."
]
descriptionAttributionLines = ["ICST / Zurich University of the Arts"]
profilePicture = "images/AmbiPlugin_logo.gif"
# Default Open Graph / social sharing image (1200×630+ recommended)
images = ["images/composing_in_ambisonics.png"]
mainSections = ["blog", "post"]
favicon = "favicons/"
contentratio = 0.82
copyright = ""
# Google Search Console verification
googleSiteVerify = "2dac45051b431b1b"

  # Popup "Aktuell": erscheint einmal pro Besuch (Browser-Sitzung), wegklickbar.
  # page = Pfad der Content-Seite (DE/EN wird automatisch gewählt); until = automatisch aus nach diesem Zeitpunkt.
  [params.popup]
  enable = true
  page = "/Blog/ascolta/20-ascolta"
  until = "2026-10-29T19:00:00+01:00"

  [params.mermaid]
  enable = true

  [params.author]
  name  = "Johannes Schuett"
  email = "johannes.schuett@zhdk.ch"

[markup.goldmark.renderer]
unsafe = true
ignoreLogs = ["warning-goldmark-raw-html"]

[markup.tableOfContents]
startLevel = 2
endLevel = 3
ordered = false

## Social links
[[params.socialIcons]]
image = "images/zhdk-logo.svg"
