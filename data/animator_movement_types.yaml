    - {slug: circle, name: "Circle", params: "Rotations 1"}
    - {slug: spiral, name: "Spiral", params: "Rotations 2, Radius change −0.3"}
    - {slug: helix, name: "Helix", params: "Rotations 3, Height rise"}
