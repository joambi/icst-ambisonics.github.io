<svg xmlns="http://www.w3.org/2000/svg" width="860" height="205" viewBox="0 0 860 205">
<rect width="860" height="205" fill="#0c0c16" rx="10"/>
<text x="430" y="21" font-size="12" fill="#a0c4ff" font-weight="bold" text-anchor="middle" font-family="Arial,sans-serif" letter-spacing="1">KRISTALL MOTION MAP — STATUS BAR</text>

<!-- Outer window border -->
<rect x="8" y="29" width="718" height="168" fill="#0d0d1c" rx="3" stroke="#22223a" stroke-width="1.5"/>

<!-- ── ROW 1: OSC + Preset (y=29, h=32) ─────────────── -->
<rect x="8" y="29" width="718" height="32" fill="#111120"/>
<rect x="8" y="29" width="718" height="1" fill="#2a2a45"/>
<!-- OSC dot green -->
<circle cx="25" cy="45" r="6" fill="#2de87a"/>
<text x="39" y="49" font-size="10.5" fill="#b8b8cc" font-family="Arial,sans-serif">OSC</text>
<!-- Host -->
<text x="66" y="49" font-size="9.5" fill="#5a5a70" font-family="Arial,sans-serif">Host:</text>
<rect x="96" y="36" width="96" height="17" fill="#080812" rx="2" stroke="#252540"/>
<text x="100" y="48" font-size="9.5" fill="#b8b8cc" font-family="Arial,sans-serif">127.0.0.1</text>
<!-- Port -->
<text x="197" y="49" font-size="9.5" fill="#5a5a70" font-family="Arial,sans-serif">Port:</text>
<rect x="224" y="36" width="44" height="17" fill="#080812" rx="2" stroke="#252540"/>
<text x="228" y="48" font-size="9.5" fill="#b8b8cc" font-family="Arial,sans-serif">9001</text>
<!-- Connect -->
<rect x="273" y="36" width="76" height="18" fill="#0c1c38" rx="2" stroke="#1a3860"/>
<text x="311" y="49" font-size="10" fill="#c8c8e0" text-anchor="middle" font-family="Arial,sans-serif">Connect</text>
<!-- in:port -->
<text x="356" y="49" font-size="9.5" fill="#3a6a88" font-family="Arial,sans-serif">in: 9002</text>
<!-- Preset -->
<text x="407" y="49" font-size="9.5" fill="#5a5a70" font-family="Arial,sans-serif">Preset:</text>
<rect x="449" y="36" width="112" height="18" fill="#080812" rx="2" stroke="#252540"/>
<text x="453" y="49" font-size="9.5" fill="#505060" font-family="Arial,sans-serif">(name)</text>
<rect x="563" y="36" width="21" height="18" fill="#0c1a30" rx="2" stroke="#1a3060"/>
<text x="573.5" y="49" font-size="10" fill="#36d398" text-anchor="middle" font-family="Arial,sans-serif">▼</text>
<rect x="587" y="36" width="52" height="18" fill="#0c1a30" rx="2" stroke="#1a3060"/>
<text x="613" y="49" font-size="10" fill="#36d398" text-anchor="middle" font-family="Arial,sans-serif">Save</text>
<rect x="642" y="36" width="52" height="18" fill="#0c1a30" rx="2" stroke="#1a3060"/>
<text x="668" y="49" font-size="10" fill="#36d398" text-anchor="middle" font-family="Arial,sans-serif">Reset</text>
<!-- Row label -->
<line x1="728" y1="45" x2="740" y2="45" stroke="#3a4a60" stroke-width="1"/>
<text x="744" y="49" font-size="10" fill="#6888b0" font-family="Arial,sans-serif" font-weight="bold">Row 1</text>
<text x="744" y="61" font-size="9" fill="#4a6880" font-family="Arial,sans-serif">OSC · Preset</text>

<!-- divider -->
<line x1="8" y1="61" x2="726" y2="61" stroke="#1a1a2c" stroke-width="1"/>

<!-- ── ROW 2: Playback (y=61, h=30) ──────────────────── -->
<!-- Speed -->
<text x="18" y="80" font-size="9.5" fill="#5a5a70" font-family="Arial,sans-serif">Speed:</text>
<rect x="57" y="68" width="52" height="17" fill="#080812" rx="2" stroke="#252540"/>
<text x="61" y="80" font-size="9.5" fill="#c0c0dc" font-family="Arial,sans-serif">×1.00</text>
<!-- BPM -->
<rect x="113" y="68" width="38" height="17" fill="#0a1428" rx="2" stroke="#182848"/>
<text x="132" y="80" font-size="10" fill="#3a70b8" text-anchor="middle" font-family="Arial,sans-serif">BPM</text>
<!-- > Fwd -->
<rect x="155" y="68" width="40" height="17" fill="#0a1428" rx="2" stroke="#182848"/>
<text x="175" y="80" font-size="10" fill="#8888b8" text-anchor="middle" font-family="Arial,sans-serif">&gt; Fwd</text>
<!-- ‖ Pause -->
<rect x="199" y="68" width="46" height="17" fill="#0a1428" rx="2" stroke="#182848"/>
<text x="222" y="80" font-size="10" fill="#8888b8" text-anchor="middle" font-family="Arial,sans-serif">‖ Pause</text>
<!-- ■ Stop -->
<rect x="249" y="68" width="38" height="17" fill="#280a0a" rx="2" stroke="#500e0e"/>
<text x="268" y="80" font-size="10" fill="#cc3c3c" text-anchor="middle" font-family="Arial,sans-serif">■ Stop</text>
<!-- status msg -->
<text x="296" y="80" font-size="9" fill="#303848" font-family="Arial,sans-serif">Preset 'Cubic' — 8 instances</text>
<!-- label -->
<line x1="728" y1="76" x2="740" y2="76" stroke="#3a4a60" stroke-width="1"/>
<text x="744" y="79" font-size="10" fill="#6888b0" font-family="Arial,sans-serif" font-weight="bold">Row 2</text>
<text x="744" y="91" font-size="9" fill="#4a6880" font-family="Arial,sans-serif">Playback</text>

<line x1="8" y1="91" x2="726" y2="91" stroke="#1a1a2c" stroke-width="1"/>

<!-- ── ROW 3: Offset + Move (y=91, h=30) ────────────── -->
<text x="18" y="110" font-size="9.5" fill="#5a7070" font-family="Arial,sans-serif">Offset</text>
<!-- 3 scrubbers: X Y Z -->
<text x="62" y="110" font-size="9.5" fill="#5a7888" font-family="Arial,sans-serif">X</text>
<rect x="73" y="97" width="68" height="17" fill="#080912" rx="2" stroke="#1c2c3c"/>
<line x1="107" y1="98" x2="107" y2="113" stroke="#223240" stroke-width="1.5"/>
<text x="77" y="109" font-size="8.5" fill="#8898a8" font-family="Arial,sans-serif">0.000</text>
<text x="146" y="110" font-size="9.5" fill="#5a7888" font-family="Arial,sans-serif">Y</text>
<rect x="157" y="97" width="68" height="17" fill="#080912" rx="2" stroke="#1c2c3c"/>
<line x1="191" y1="98" x2="191" y2="113" stroke="#223240" stroke-width="1.5"/>
<text x="161" y="109" font-size="8.5" fill="#8898a8" font-family="Arial,sans-serif">0.000</text>
<text x="230" y="110" font-size="9.5" fill="#5a7888" font-family="Arial,sans-serif">Z</text>
<rect x="241" y="97" width="68" height="17" fill="#080912" rx="2" stroke="#1c2c3c"/>
<line x1="275" y1="98" x2="275" y2="113" stroke="#223240" stroke-width="1.5"/>
<text x="245" y="109" font-size="8.5" fill="#8898a8" font-family="Arial,sans-serif">0.000</text>
<!-- Move -->
<text x="322" y="110" font-size="9.5" fill="#5a7070" font-family="Arial,sans-serif">Move</text>
<text x="361" y="110" font-size="9.5" fill="#5a7888" font-family="Arial,sans-serif">X</text>
<rect x="372" y="97" width="68" height="17" fill="#080912" rx="2" stroke="#1c2c3c"/>
<rect x="372" y="100" width="16" height="11" fill="#123820" rx="1"/>
<line x1="388" y1="98" x2="388" y2="113" stroke="#223240" stroke-width="1.5"/>
<text x="376" y="109" font-size="8.5" fill="#8898a8" font-family="Arial,sans-serif">0.008</text>
<text x="445" y="110" font-size="9.5" fill="#5a7888" font-family="Arial,sans-serif">Y</text>
<rect x="456" y="97" width="68" height="17" fill="#080912" rx="2" stroke="#1c2c3c"/>
<line x1="490" y1="98" x2="490" y2="113" stroke="#223240" stroke-width="1.5"/>
<text x="460" y="109" font-size="8.5" fill="#8898a8" font-family="Arial,sans-serif">0.000</text>
<text x="529" y="110" font-size="9.5" fill="#5a7888" font-family="Arial,sans-serif">Z</text>
<rect x="540" y="97" width="68" height="17" fill="#080912" rx="2" stroke="#1c2c3c"/>
<line x1="574" y1="98" x2="574" y2="113" stroke="#223240" stroke-width="1.5"/>
<text x="544" y="109" font-size="8.5" fill="#8898a8" font-family="Arial,sans-serif">0.000</text>
<!-- label -->
<line x1="728" y1="106" x2="740" y2="106" stroke="#3a4a60" stroke-width="1"/>
<text x="744" y="109" font-size="10" fill="#6888b0" font-family="Arial,sans-serif" font-weight="bold">Row 3</text>
<text x="744" y="121" font-size="9" fill="#4a6880" font-family="Arial,sans-serif">Offset · Move</text>

<line x1="8" y1="121" x2="726" y2="121" stroke="#1a1a2c" stroke-width="1"/>

<!-- ── ROW 4: Rotate (y=121, h=30) ────────────────── -->
<text x="18" y="140" font-size="9.5" fill="#5a7070" font-family="Arial,sans-serif">Rotate</text>
<!-- Pt -->
<text x="68" y="140" font-size="9.5" fill="#8878b8" font-family="Arial,sans-serif">Pt</text>
<rect x="82" y="127" width="68" height="17" fill="#080912" rx="2" stroke="#201c38"/>
<rect x="82" y="130" width="12" height="11" fill="#3a1a70" rx="1"/>
<line x1="116" y1="128" x2="116" y2="143" stroke="#2c2040" stroke-width="1.5"/>
<text x="86" y="139" font-size="8.5" fill="#9888c8" font-family="Arial,sans-serif">-15°</text>
<!-- Yw -->
<text x="156" y="140" font-size="9.5" fill="#8878b8" font-family="Arial,sans-serif">Yw</text>
<rect x="173" y="127" width="68" height="17" fill="#080912" rx="2" stroke="#201c38"/>
<rect x="191" y="130" width="18" height="11" fill="#3a1a70" rx="1"/>
<line x1="207" y1="128" x2="207" y2="143" stroke="#2c2040" stroke-width="1.5"/>
<text x="177" y="139" font-size="8.5" fill="#9888c8" font-family="Arial,sans-serif">30°</text>
<!-- Rl -->
<text x="247" y="140" font-size="9.5" fill="#8878b8" font-family="Arial,sans-serif">Rl</text>
<rect x="263" y="127" width="68" height="17" fill="#080912" rx="2" stroke="#201c38"/>
<line x1="297" y1="128" x2="297" y2="143" stroke="#2c2040" stroke-width="1.5"/>
<text x="267" y="139" font-size="8.5" fill="#9888c8" font-family="Arial,sans-serif">0°</text>
<!-- label -->
<line x1="728" y1="136" x2="740" y2="136" stroke="#3a4a60" stroke-width="1"/>
<text x="744" y="139" font-size="10" fill="#6888b0" font-family="Arial,sans-serif" font-weight="bold">Row 4</text>
<text x="744" y="151" font-size="9" fill="#4a6880" font-family="Arial,sans-serif">Rotate Pt/Yw/Rl</text>

<line x1="8" y1="151" x2="726" y2="151" stroke="#161622" stroke-width="1"/>

<!-- ── PRESET BAR (y=151, h=26) ──────────────────── -->
<rect x="8" y="151" width="718" height="26" fill="#090912"/>
<!-- 8 buttons: 718/8 = 89.75px each -->
<!-- Buttons 1-4 teal, 5-8 amber -->
<rect x="8.0" y="153" width="87.8" height="22" fill="#0c1c2c" rx="2" stroke="#1a3650"/>
<text x="52.9" y="167" font-size="9" fill="#36d398" text-anchor="middle" font-family="Arial,sans-serif">1 Cubic</text>
<line x1="96.8" y1="154" x2="96.8" y2="172" stroke="#1c1c2c" stroke-width="1"/>
<rect x="97.8" y="153" width="87.8" height="22" fill="#0c1c2c" rx="2" stroke="#1a3650"/>
<text x="142.6" y="167" font-size="9" fill="#36d398" text-anchor="middle" font-family="Arial,sans-serif">2 Tetragonal</text>
<line x1="186.5" y1="154" x2="186.5" y2="172" stroke="#1c1c2c" stroke-width="1"/>
<rect x="187.5" y="153" width="87.8" height="22" fill="#0c1c2c" rx="2" stroke="#1a3650"/>
<text x="232.4" y="167" font-size="9" fill="#36d398" text-anchor="middle" font-family="Arial,sans-serif">3 Hexagonal</text>
<line x1="276.2" y1="154" x2="276.2" y2="172" stroke="#1c1c2c" stroke-width="1"/>
<rect x="277.2" y="153" width="87.8" height="22" fill="#0c1c2c" rx="2" stroke="#1a3650"/>
<text x="322.1" y="167" font-size="9" fill="#36d398" text-anchor="middle" font-family="Arial,sans-serif">4 Rnd.Swarm</text>
<line x1="366.0" y1="154" x2="366.0" y2="172" stroke="#1c1c2c" stroke-width="1"/>
<rect x="367.0" y="153" width="87.8" height="22" fill="#1c140a" rx="2" stroke="#3a2a10"/>
<text x="411.9" y="167" font-size="9" fill="#e8c832" text-anchor="middle" font-family="Arial,sans-serif">5 Orthorhombic</text>
<line x1="455.8" y1="154" x2="455.8" y2="172" stroke="#1c1c2c" stroke-width="1"/>
<rect x="456.8" y="153" width="87.8" height="22" fill="#1c140a" rx="2" stroke="#3a2a10"/>
<text x="501.6" y="167" font-size="9" fill="#e8c832" text-anchor="middle" font-family="Arial,sans-serif">6 Rhombohedral</text>
<line x1="545.5" y1="154" x2="545.5" y2="172" stroke="#1c1c2c" stroke-width="1"/>
<rect x="546.5" y="153" width="87.8" height="22" fill="#1c140a" rx="2" stroke="#3a2a10"/>
<text x="591.4" y="167" font-size="9" fill="#e8c832" text-anchor="middle" font-family="Arial,sans-serif">7 Monoclinic</text>
<line x1="635.2" y1="154" x2="635.2" y2="172" stroke="#1c1c2c" stroke-width="1"/>
<rect x="636.2" y="153" width="87.8" height="22" fill="#1c140a" rx="2" stroke="#3a2a10"/>
<text x="681.1" y="167" font-size="9" fill="#e8c832" text-anchor="middle" font-family="Arial,sans-serif">8 Triclinic</text>
<!-- Preset bar label -->
<line x1="728" y1="164" x2="740" y2="164" stroke="#3a4a60" stroke-width="1"/>
<text x="744" y="167" font-size="10" fill="#6888b0" font-family="Arial,sans-serif" font-weight="bold">Quick</text>
<text x="744" y="179" font-size="9" fill="#4a6880" font-family="Arial,sans-serif">Presets 1–8</text>

<!-- Bottom border -->
<rect x="8" y="29" width="718" height="168" fill="none" rx="3" stroke="#22223a" stroke-width="1.5"/>
</svg>