<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title3 desc3">
  <title id="title3">Approach 3 — Hybrid production: real IR plus synthetic reverb</title>
  <desc id="desc3">Signal flow diagram showing hybrid production: the source is encoded and routed through Spat5 for early reflections (synthetic path), while a venue IR feeds a convolution plugin for the late diffuse tail (real IR path). Both paths merge on the Ambisonics bus, which outputs B-format.</desc>
  <style>
    .bg { fill: #14212b; }
    .panel { fill: #1d2f3a; stroke: #6086b4; stroke-width: 2.5; }
    .panel-synth { fill: #1e2838; stroke: #7aa6d8; stroke-width: 2.5; }
    .panel-ir { fill: #1f2f20; stroke: #8fc59a; stroke-width: 2.5; }
    .panel-bus { fill: #2a2218; stroke: #c5a85a; stroke-width: 3; }
    .panel-out { fill: #1d2f3a; stroke: #6086b4; stroke-width: 2.5; }
    .text { fill: #f2f5f7; font: 600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .sub { fill: #b6c3cc; font: 400 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .small { fill: #8fa4b2; font: 400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .label-synth { fill: #7ab8d8; font: 700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; letter-spacing: .06em; text-transform: uppercase; }
    .label-ir { fill: #8fc59a; font: 700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; letter-spacing: .06em; text-transform: uppercase; }
    .label-bus { fill: #c5a85a; font: 700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; letter-spacing: .06em; text-transform: uppercase; }
    .phase { fill: #9fd0ff; font: 700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; letter-spacing: .07em; text-transform: uppercase; }
    .arrow { stroke: #9fd0ff; stroke-width: 4; fill: none; stroke-linecap: round; }
    .arrow-blue { stroke: #7aa6d8; stroke-width: 3.5; fill: none; stroke-linecap: round; }
    .arrow-green { stroke: #8fc59a; stroke-width: 3.5; fill: none; stroke-linecap: round; }
    .arrow-gold { stroke: #c5a85a; stroke-width: 4; fill: none; stroke-linecap: round; }
  </style>
  <defs>
    <marker id="ah3" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 z" fill="#9fd0ff"/>
    </marker>
    <marker id="ah3b" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 z" fill="#7aa6d8"/>
    </marker>
    <marker id="ah3g" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 z" fill="#8fc59a"/>
    </marker>
    <marker id="ah3gold" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 z" fill="#c5a85a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect class="bg" width="1280" height="400"/>

  <!-- Phase label -->
  <text class="phase" x="40" y="36">③ Hybrid — Real IR + Synthetic Early Reflections</text>

  <!-- Source box (left, centered vertically) -->
  <rect class="panel" x="40" y="155" width="180" height="80" rx="10"/>
  <text class="text" x="130" y="190" text-anchor="middle">Source</text>
  <text class="sub" x="130" y="214" text-anchor="middle">DAW track</text>

  <!-- Fork arrow from source: one up to synth path, one down to IR path -->
  <!-- Up branch to Encoder + Spat5 -->
  <polyline class="arrow-blue" points="223,185 275,185 275,130 340,130" marker-end="url(#ah3b)"/>
  <!-- Down branch to Venue IR -->
  <polyline class="arrow-green" points="223,205 275,205 275,280 340,280" marker-end="url(#ah3g)"/>

  <!-- SYNTHETIC PATH (upper) -->
  <text class="label-synth" x="345" y="72">Synthetic path — early reflections</text>
  <!-- Box: Encoder + Spat5 -->
  <rect class="panel-synth" x="340" y="84" width="340" height="80" rx="10"/>
  <text class="text" x="510" y="119" text-anchor="middle">Encoder + Spat5</text>
  <text class="sub" x="510" y="143" text-anchor="middle">spatial positioning · early reflections</text>

  <!-- Arrow synth → Ambi Bus -->
  <polyline class="arrow-blue" points="683,124 760,124 760,195" marker-end="url(#ah3b)"/>

  <!-- REAL IR PATH (lower) -->
  <text class="label-ir" x="345" y="254">Real IR path — late diffuse tail</text>
  <!-- Box: Venue IR -->
  <rect class="panel-ir" x="340" y="258" width="185" height="80" rx="10"/>
  <text class="text" x="432" y="293" text-anchor="middle">Venue IR</text>
  <text class="sub" x="432" y="317" text-anchor="middle">B-format file</text>

  <!-- Arrow IR → Conv Plugin -->
  <line class="arrow-green" x1="528" y1="298" x2="593" y2="298" marker-end="url(#ah3g)"/>

  <!-- Box: Conv Plugin -->
  <rect class="panel-ir" x="598" y="258" width="185" height="80" rx="10"/>
  <text class="text" x="690" y="293" text-anchor="middle">Conv. Plugin</text>
  <text class="sub" x="690" y="317" text-anchor="middle">late diffuse tail</text>

  <!-- Arrow Conv → Ambi Bus -->
  <polyline class="arrow-green" points="786,298 855,298 855,255" marker-end="url(#ah3g)"/>

  <!-- Ambi Bus (central merge) -->
  <text class="label-bus" x="765" y="168">Merge</text>
  <rect class="panel-bus" x="760" y="175" width="200" height="80" rx="12"/>
  <text class="text" x="860" y="210" text-anchor="middle">Ambi Bus</text>
  <text class="sub" x="860" y="234" text-anchor="middle">B-format mix</text>

  <!-- Arrow Ambi Bus → Output -->
  <line class="arrow-gold" x1="963" y1="215" x2="1050" y2="215" marker-end="url(#ah3gold)"/>

  <!-- Output -->
  <rect class="panel-out" x="1055" y="175" width="185" height="80" rx="10"/>
  <text class="text" x="1147" y="210" text-anchor="middle">B-format</text>
  <text class="sub" x="1147" y="234" text-anchor="middle">Output</text>

  <!-- Gain staging note -->
  <text class="small" x="640" y="370" text-anchor="middle">Careful gain staging required — synthetic early reflections + real late tail must be balanced to avoid reverb multiplication</text>

</svg>
