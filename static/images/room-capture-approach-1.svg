<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="520" viewBox="0 0 1540 520" role="img" aria-labelledby="title1 desc1">
  <title id="title1">Approach 1 — Record the room as a convolution reverb</title>
  <desc id="desc1">Signal flow diagram: Sine sweep generator feeds a loudspeaker in the room; an Ambisonics microphone captures the response; IR decoder converts to B-format IR file; in production the IR is loaded into a convolution plugin applied to the Ambisonics bus.</desc>
  <style>
    .bg { fill: #14212b; }
    .panel { fill: #1d2f3a; stroke: #6086b4; stroke-width: 2.5; }
    .panel-room { fill: #1a3030; stroke: #5aada0; stroke-width: 2; stroke-dasharray: 8 5; }
    .panel-ir { fill: #1f2f20; stroke: #8fc59a; stroke-width: 2.5; }
    .panel-prod { fill: #2a1f30; stroke: #b48fc5; stroke-width: 2.5; }
    .text { fill: #f2f5f7; font: 600 27px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .sub { fill: #b6c3cc; font: 400 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .phase { fill: #9fd0ff; font: 700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; letter-spacing: .07em; text-transform: uppercase; }
    .room-label { fill: #5aada0; font: 600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; letter-spacing: .06em; text-transform: uppercase; }
    .arrow { stroke: #9fd0ff; stroke-width: 4; fill: none; stroke-linecap: round; }
    .arrow-green { stroke: #8fc59a; stroke-width: 4; fill: none; stroke-linecap: round; }
    .arrow-purple { stroke: #c09fd0; stroke-width: 4; fill: none; stroke-linecap: round; }
    .divider { stroke: #2e4455; stroke-width: 1.5; stroke-dasharray: 6 6; }
  </style>
  <defs>
    <marker id="ah1" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 z" fill="#9fd0ff"/>
    </marker>
    <marker id="ah1g" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 z" fill="#8fc59a"/>
    </marker>
    <marker id="ah1p" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 z" fill="#c09fd0"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect class="bg" width="1540" height="520"/>

  <!-- Phase 1 label -->
  <text class="phase" x="70" y="52">① Measurement — Room IR Capture</text>

  <!-- Room acoustics backdrop -->
  <rect class="panel-room" x="390" y="74" width="560" height="142" rx="14"/>
  <text class="room-label" x="670" y="96" text-anchor="middle">Room Acoustics</text>

  <!-- Box 1: Sine Sweep Gen (x=40, y=78, w=190, h=70) -->
  <rect class="panel" x="70" y="108" width="220" height="88" rx="10"/>
  <text class="text" x="180" y="146" text-anchor="middle">Sine Sweep</text>
  <text class="sub" x="180" y="176" text-anchor="middle">Generator</text>

  <!-- Box 2: Loudspeaker (x=328, y=78) -->
  <rect class="panel" x="430" y="108" width="220" height="88" rx="10"/>
  <text class="text" x="540" y="146" text-anchor="middle">Loudspeaker</text>
  <text class="sub" x="540" y="176" text-anchor="middle">full-range</text>

  <!-- Box 3: Ambi Mic (x=564, y=78) -->
  <rect class="panel" x="690" y="108" width="220" height="88" rx="10"/>
  <text class="text" x="800" y="146" text-anchor="middle">Ambi Mic</text>
  <text class="sub" x="800" y="176" text-anchor="middle">Zylia ZM-1 · Ambeo</text>

  <!-- Box 4: IR Decoder (x=820, y=78) -->
  <rect class="panel" x="990" y="108" width="220" height="88" rx="10"/>
  <text class="text" x="1100" y="146" text-anchor="middle">IR Decoder</text>
  <text class="sub" x="1100" y="176" text-anchor="middle">IEM · SPARTA</text>

  <!-- Box 5: B-format IR File (x=1060, y=78, green) -->
  <rect class="panel-ir" x="1270" y="108" width="200" height="88" rx="10"/>
  <text class="text" x="1370" y="146" text-anchor="middle">B-format</text>
  <text class="sub" x="1370" y="176" text-anchor="middle">IR File (.wav)</text>

  <!-- Arrows row 1 -->
  <line class="arrow" x1="295" y1="152" x2="425" y2="152" marker-end="url(#ah1)"/>
  <line class="arrow" x1="655" y1="152" x2="685" y2="152" marker-end="url(#ah1)"/>
  <line class="arrow" x1="915" y1="152" x2="985" y2="152" marker-end="url(#ah1)"/>
  <line class="arrow" x1="1215" y1="152" x2="1265" y2="152" marker-end="url(#ah1)"/>

  <!-- Divider -->
  <line class="divider" x1="70" y1="258" x2="1470" y2="258"/>

  <!-- Phase 2 label -->
  <text class="phase" x="70" y="292">② Production — Apply IR in DAW</text>

  <!-- Box 6: Source (x=40, y=268) -->
  <rect class="panel-prod" x="70" y="320" width="220" height="88" rx="10"/>
  <text class="text" x="180" y="358" text-anchor="middle">Source</text>
  <text class="sub" x="180" y="388" text-anchor="middle">DAW track</text>

  <!-- Box 7: Ambi Encoder (x=300, y=268) -->
  <rect class="panel-prod" x="360" y="320" width="240" height="88" rx="10"/>
  <text class="text" x="480" y="358" text-anchor="middle">Ambi Encoder</text>
  <text class="sub" x="480" y="388" text-anchor="middle">positioned</text>

  <!-- Box 8: Ambi Bus (x=560, y=268) -->
  <rect class="panel-prod" x="670" y="320" width="220" height="88" rx="10"/>
  <text class="text" x="780" y="358" text-anchor="middle">Ambi Bus</text>
  <text class="sub" x="780" y="388" text-anchor="middle">B-format</text>

  <!-- Box 9: Convolution Plugin (x=820, y=268) -->
  <rect class="panel-ir" x="960" y="320" width="270" height="88" rx="10"/>
  <text class="text" x="1095" y="354" text-anchor="middle">Conv. Plugin</text>
  <text class="sub" x="1095" y="381" text-anchor="middle">ReaVerb · Altiverb</text>
  <text class="sub" x="1095" y="404" text-anchor="middle">+ B-format IR loaded</text>

  <!-- Box 10: B-format Output (x=1105, y=268) -->
  <rect class="panel" x="1290" y="320" width="180" height="88" rx="10"/>
  <text class="text" x="1380" y="358" text-anchor="middle">B-format</text>
  <text class="sub" x="1380" y="388" text-anchor="middle">Output</text>

  <!-- Arrows row 2 -->
  <line class="arrow-purple" x1="295" y1="364" x2="355" y2="364" marker-end="url(#ah1p)"/>
  <line class="arrow-purple" x1="605" y1="364" x2="665" y2="364" marker-end="url(#ah1p)"/>
  <line class="arrow-purple" x1="895" y1="364" x2="955" y2="364" marker-end="url(#ah1p)"/>
  <line class="arrow-purple" x1="1235" y1="364" x2="1285" y2="364" marker-end="url(#ah1p)"/>

  <!-- Connecting arrow: B-format IR File → Conv Plugin (L-shaped, green) -->
  <polyline class="arrow-green" points="1370,196 1370,288 1095,288 1095,315" marker-end="url(#ah1g)"/>

</svg>
