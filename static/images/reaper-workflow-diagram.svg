<svg viewBox="0 0 720 800" xmlns="http://www.w3.org/2000/svg" role="img"
  font-family="system-ui, -apple-system, 'Helvetica Neue', sans-serif">
  <title>REAPER ICST Ambisonics Workflow</title>
  <desc>Schrittweise Anleitung für den ICST Ambisonics Workflow in REAPER</desc>

  <defs>
    <marker id="a1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3d5a70"/>
    </marker>
    <marker id="a2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a9eda"/>
    </marker>
    <marker id="a3" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c04040"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="800" rx="12" fill="#161b22"/>

  <!-- ═══ TITLE ═══ -->
  <rect x="0" y="0" width="720" height="50" rx="12" fill="#1c2a3a"/>
  <rect x="0" y="38" width="720" height="12" fill="#1c2a3a"/>
  <text x="360" y="32" text-anchor="middle"
    fill="#d0e8f7" font-size="13" font-weight="700" letter-spacing="0.06em">
    REAPER · ICST AMBISONICS WORKFLOW
  </text>

  <!-- ═══ SECTION 1: VORBEREITUNG ═══ -->
  <text x="36" y="70" fill="#4a7a9a" font-size="9" font-weight="700" letter-spacing="0.12em">VORBEREITUNG</text>
  <line x1="36" y1="74" x2="684" y2="74" stroke="#1e3040" stroke-width="1"/>

  <!-- Step 1 -->
  <rect x="36" y="82" width="648" height="48" rx="6" fill="#1a2d42" stroke="#253d56" stroke-width="1"/>
  <circle cx="62" cy="106" r="12" fill="#1c3a56" stroke="#2c5070" stroke-width="1.5"/>
  <text x="62" y="111" text-anchor="middle" fill="#7ec8f0" font-size="11" font-weight="700">1</text>
  <text x="88" y="100" fill="#c8e0f0" font-size="12" font-weight="600">Projekt in REAPER öffnen</text>
  <text x="88" y="118" fill="#4a7a9a" font-size="10">ICST Ambisonics Default Session laden</text>

  <!-- Arrow 1→2 -->
  <line x1="360" y1="132" x2="360" y2="144" stroke="#3d5a70" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- Step 2 -->
  <rect x="36" y="146" width="648" height="48" rx="6" fill="#1a2d42" stroke="#253d56" stroke-width="1"/>
  <circle cx="62" cy="170" r="12" fill="#1c3a56" stroke="#2c5070" stroke-width="1.5"/>
  <text x="62" y="175" text-anchor="middle" fill="#7ec8f0" font-size="11" font-weight="700">2</text>
  <text x="88" y="164" fill="#c8e0f0" font-size="12" font-weight="600">Drei Quellen trocken anhören</text>
  <text x="88" y="182" fill="#4a7a9a" font-size="10">S01 · S02 · S03 — Dry-Signal, kein Encoder aktiv</text>

  <!-- Arrow 2→3 -->
  <line x1="360" y1="196" x2="360" y2="208" stroke="#3d5a70" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- Step 3 -->
  <rect x="36" y="210" width="648" height="62" rx="6" fill="#182a1c" stroke="#284030" stroke-width="1"/>
  <circle cx="62" cy="241" r="12" fill="#204028" stroke="#3a6040" stroke-width="1.5"/>
  <text x="62" y="246" text-anchor="middle" fill="#7dd3a8" font-size="11" font-weight="700">3</text>
  <text x="88" y="228" fill="#c0e8cc" font-size="12" font-weight="600">setup_icst_routing.lua laden &amp; ausführen</text>
  <text x="88" y="246" fill="#4a7a5a" font-size="10">Actions  ›  Show action list  ›  ReaScript: Load…</text>
  <text x="88" y="262" fill="#4a7a5a" font-size="10">Script auswählen und ausführen → Routing wird eingerichtet</text>

  <!-- Arrow 3→4 -->
  <line x1="360" y1="274" x2="360" y2="286" stroke="#3d5a70" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- Step 4 -->
  <rect x="36" y="288" width="648" height="48" rx="6" fill="#241e10" stroke="#3c3018" stroke-width="1"/>
  <circle cx="62" cy="312" r="12" fill="#3a2c10" stroke="#5a4418" stroke-width="1.5"/>
  <text x="62" y="317" text-anchor="middle" fill="#e0b840" font-size="11" font-weight="700">4</text>
  <text x="88" y="306" fill="#d8c888" font-size="12" font-weight="600">Stereo-Pan-Automation — nur als Preview</text>
  <text x="88" y="324" fill="#806040" font-size="10">Nicht für Ambisonics verwenden · direkt im ICST Encoder arbeiten</text>

  <!-- ═══ SECTION 2: SIGNAL-KETTE ═══ -->
  <line x1="360" y1="338" x2="360" y2="352" stroke="#3d5a70" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="36" y="370" fill="#4a7a9a" font-size="9" font-weight="700" letter-spacing="0.12em">SIGNAL-KETTE</text>
  <line x1="36" y1="374" x2="684" y2="374" stroke="#1e3040" stroke-width="1"/>

  <!-- Quellen box -->
  <rect x="160" y="382" width="400" height="52" rx="6" fill="#1a2535" stroke="#253550" stroke-width="1"/>
  <text x="360" y="400" text-anchor="middle" fill="#4a7a9a" font-size="9" font-weight="700" letter-spacing="0.1em">QUELLEN</text>
  <text x="360" y="418" text-anchor="middle" fill="#90c0e0" font-size="13" font-weight="700">S01 · S02 · S03</text>
  <text x="360" y="430" text-anchor="middle" fill="#4a7a9a" font-size="9">Mono · trocken · 1 Kanal je Track</text>

  <!-- Arrow Quellen → Track 10 -->
  <line x1="360" y1="436" x2="360" y2="450" stroke="#4a9eda" stroke-width="2" marker-end="url(#a2)"/>
  <text x="374" y="445" fill="#2a6a9a" font-size="9">Mono Ch 1 → Enc Ch N</text>

  <!-- Track 10: MultiEncoder -->
  <rect x="160" y="452" width="400" height="56" rx="6" fill="#182818" stroke="#2a4a2a" stroke-width="1.5"/>
  <text x="360" y="468" text-anchor="middle" fill="#3a7a4a" font-size="9" font-weight="700" letter-spacing="0.1em">TRACK 10</text>
  <text x="360" y="486" text-anchor="middle" fill="#7dd3a8" font-size="13" font-weight="700">ICST MultiEncoder</text>
  <text x="360" y="500" text-anchor="middle" fill="#3a7a4a" font-size="9">MonoEncoder (1 Quelle) oder MultiEncoder (bis 64)</text>
  <!-- Step badge -->
  <rect x="536" y="456" width="18" height="18" rx="3" fill="#2a4a2a"/>
  <text x="545" y="469" text-anchor="middle" fill="#7dd3a8" font-size="10" font-weight="700">5</text>

  <!-- Arrow Track 10 → Track 11 -->
  <line x1="360" y1="510" x2="360" y2="524" stroke="#4a9eda" stroke-width="2" marker-end="url(#a2)"/>
  <text x="374" y="519" fill="#2a6a9a" font-size="9">B-Format · ambiX · ACN/SN3D</text>

  <!-- Track 11: HOA Bus -->
  <rect x="160" y="526" width="400" height="56" rx="6" fill="#2a1616" stroke="#4a2a2a" stroke-width="1.5"/>
  <text x="360" y="542" text-anchor="middle" fill="#7a3a3a" font-size="9" font-weight="700" letter-spacing="0.1em">TRACK 11</text>
  <text x="360" y="560" text-anchor="middle" fill="#f08080" font-size="13" font-weight="700">B-Format Master HOA Bus</text>
  <text x="360" y="574" text-anchor="middle" fill="#7a3a3a" font-size="9">Zentraler HOA-Bus · Export von hier · ambiX</text>
  <!-- Step badge -->
  <rect x="536" y="530" width="18" height="18" rx="3" fill="#4a2a2a"/>
  <text x="545" y="543" text-anchor="middle" fill="#f08080" font-size="10" font-weight="700">6</text>

  <!-- Export branch (right side of Track 11) -->
  <line x1="560" y1="554" x2="600" y2="554" stroke="#c04040" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#a3)"/>
  <rect x="602" y="540" width="76" height="28" rx="4" fill="#2a1616" stroke="#4a2a2a" stroke-width="1"/>
  <text x="640" y="553" text-anchor="middle" fill="#e06060" font-size="9" font-weight="700">EXPORT</text>
  <text x="640" y="563" text-anchor="middle" fill="#7a3a3a" font-size="8">.wav / RF64</text>

  <!-- Arrow Track 11 → Track 12 -->
  <line x1="360" y1="584" x2="360" y2="598" stroke="#4a9eda" stroke-width="2" marker-end="url(#a2)"/>
  <text x="374" y="593" fill="#2a6a9a" font-size="9">64ch → Binaural / Speaker</text>

  <!-- Track 12: Binaural Monitor -->
  <rect x="160" y="600" width="400" height="56" rx="6" fill="#1c1828" stroke="#2e2848" stroke-width="1.5"/>
  <text x="360" y="616" text-anchor="middle" fill="#5a4a8a" font-size="9" font-weight="700" letter-spacing="0.1em">TRACK 12</text>
  <text x="360" y="634" text-anchor="middle" fill="#b09ce0" font-size="13" font-weight="700">Binaural Monitor / Decoder</text>
  <text x="360" y="648" text-anchor="middle" fill="#5a4a8a" font-size="9">Kopfhörer (IEM / dearVR) oder Lautsprecher-Decoder</text>
  <!-- Step badge -->
  <rect x="536" y="604" width="18" height="18" rx="3" fill="#2e2848"/>
  <text x="545" y="617" text-anchor="middle" fill="#b09ce0" font-size="10" font-weight="700">7</text>

  <!-- ═══ NOTES ═══ -->
  <line x1="36" y1="672" x2="684" y2="672" stroke="#1e3040" stroke-width="1"/>

  <!-- Note 1 -->
  <rect x="36" y="680" width="200" height="52" rx="5" fill="#1a2535" stroke="#1e3040" stroke-width="1"/>
  <text x="48" y="697" fill="#7ec8f0" font-size="10" font-weight="600">🎧  Monitoring</text>
  <text x="48" y="712" fill="#4a7a9a" font-size="9">Binaural ODER Speaker —</text>
  <text x="48" y="724" fill="#4a7a9a" font-size="9">nie gleichzeitig aktiv</text>

  <!-- Note 2 -->
  <rect x="260" y="680" width="200" height="52" rx="5" fill="#1a2535" stroke="#1e3040" stroke-width="1"/>
  <text x="272" y="697" fill="#7dd3a8" font-size="10" font-weight="600">📐  Encoder-Wahl</text>
  <text x="272" y="712" fill="#4a7a9a" font-size="9">MonoEncoder: eine Quelle</text>
  <text x="272" y="724" fill="#4a7a9a" font-size="9">MultiEncoder: bis 64 Quellen</text>

  <!-- Note 3 -->
  <rect x="484" y="680" width="200" height="52" rx="5" fill="#1a2535" stroke="#1e3040" stroke-width="1"/>
  <text x="496" y="697" fill="#f08080" font-size="10" font-weight="600">💾  Export</text>
  <text x="496" y="712" fill="#4a7a9a" font-size="9">B-Format Master solo setzen</text>
  <text x="496" y="724" fill="#4a7a9a" font-size="9">Wave RF64 · 64ch · 48 kHz</text>

  <!-- Preflight hint -->
  <rect x="36" y="744" width="648" height="34" rx="5" fill="#182820" stroke="#2a4030" stroke-width="1"/>
  <text x="360" y="757" text-anchor="middle" fill="#7dd3a8" font-size="10" font-weight="600">🛫  Preflight-Check vor dem Arbeiten ausführen</text>
  <text x="360" y="771" text-anchor="middle" fill="#3a6040" font-size="9">Actions › ICST_Preflight_Check.lua → alle 5 Checks grün?</text>

  <!-- Footer -->
  <text x="360" y="793" text-anchor="middle" fill="#253550" font-size="8">ICST Ambisonics · ZHdK · ambisonics.ch</text>
</svg>
