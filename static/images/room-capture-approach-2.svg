<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title2 desc2">
  <title id="title2">Approach 2 — Synthesise a virtual room in Ambisonics</title>
  <desc id="desc2">Signal flow diagram: DAW source feeds a spatial reverb engine (Spat5, IEM FdnReverb, SPARTA). Room parameters such as room size, RT60, early reflections, and diffusion are fully controllable. Output is B-format HOA.</desc>
  <style>
    .bg { fill: #14212b; }
    .panel { fill: #1d2f3a; stroke: #6086b4; stroke-width: 2.5; }
    .panel-engine { fill: #1e2838; stroke: #7aa6d8; stroke-width: 3; }
    .panel-param { fill: #1a2530; stroke: #4a7a9a; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .panel-out { fill: #1d2f3a; stroke: #6086b4; stroke-width: 2.5; }
    .text { fill: #f2f5f7; font: 600 23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .sub { fill: #b6c3cc; font: 400 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .param-text { fill: #7ab8d8; font: 400 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .phase { fill: #9fd0ff; font: 700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; letter-spacing: .07em; text-transform: uppercase; }
    .arrow { stroke: #9fd0ff; stroke-width: 4; fill: none; stroke-linecap: round; }
    .arrow-dashed { stroke: #7aa6d8; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-dasharray: 7 5; }
  </style>
  <defs>
    <marker id="ah2" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 z" fill="#9fd0ff"/>
    </marker>
    <marker id="ah2d" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 z" fill="#7aa6d8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect class="bg" width="1280" height="320"/>

  <!-- Phase label -->
  <text class="phase" x="40" y="36">② Virtual Room — Algorithmic Synthesis</text>

  <!-- Box 1: Source (x=40, y=108, w=190, h=80) -->
  <rect class="panel" x="40" y="108" width="190" height="80" rx="10"/>
  <text class="text" x="135" y="143" text-anchor="middle">Source</text>
  <text class="sub" x="135" y="167" text-anchor="middle">DAW track</text>

  <!-- Arrow 1→2 -->
  <line class="arrow" x1="233" y1="148" x2="333" y2="148" marker-end="url(#ah2)"/>

  <!-- Box 2: Spatial Reverb Engine (large, central) -->
  <rect class="panel-engine" x="338" y="68" width="560" height="160" rx="14"/>
  <text class="text" x="618" y="106" text-anchor="middle">Spatial Reverb Engine</text>
  <text class="sub" x="618" y="130" text-anchor="middle">IRCAM Spat5 · IEM FdnReverb · SPARTA AmbiBIN</text>
  <text class="sub" x="618" y="154" text-anchor="middle">Panoramix · dearVR Spatial Connect</text>
  <text class="sub" x="618" y="178" text-anchor="middle">Aalto Spatial</text>

  <!-- Arrow 2→3 -->
  <line class="arrow" x1="901" y1="148" x2="1005" y2="148" marker-end="url(#ah2)"/>

  <!-- Box 3: B-format Output -->
  <rect class="panel-out" x="1010" y="108" width="220" height="80" rx="10"/>
  <text class="text" x="1120" y="143" text-anchor="middle">B-format</text>
  <text class="sub" x="1120" y="167" text-anchor="middle">HOA Output</text>

  <!-- Parameters box below engine -->
  <rect class="panel-param" x="338" y="248" width="560" height="52" rx="10"/>
  <text class="param-text" x="618" y="270" text-anchor="middle">Controllable per source: Room Size · RT60 · Early Reflections · Diffusion · Air Absorption</text>
  <text class="param-text" x="618" y="290" text-anchor="middle">Room geometry can change across sections — the virtual room is a compositional instrument</text>

  <!-- Dashed arrow from engine box bottom to params box -->
  <line class="arrow-dashed" x1="618" y1="231" x2="618" y2="244" marker-end="url(#ah2d)"/>

</svg>
