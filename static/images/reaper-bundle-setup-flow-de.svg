<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 356" role="img"><title>Einrichten und Starten</title><desc>Drei einmalige Einrichtungsschritte, danach startet man immer über ICST_Ambi_Reaper starten.command.</desc><defs><marker id="ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#6b7280"/></marker></defs><rect width="780" height="356" rx="12" fill="#f9fafb"/><text x="390.0" y="28" font-size="15" fill="#374151" font-weight="700" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Einmal einrichten, dann immer so starten</text><rect x="16" y="46" width="748" height="130" rx="10" fill="#eff6ff" stroke="#5b8dd9" stroke-width="1.2"/><rect x="16" y="190" width="748" height="130" rx="10" fill="#ecfdf5" stroke="#3f9b7a" stroke-width="1.2"/><text x="30" y="66" font-size="12" fill="#2e5f9a" font-weight="700" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">EINMALIG: Einrichtung</text><text x="30" y="210" font-size="12" fill="#2a6f56" font-weight="700" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">JEDES MAL: Start</text><rect x="30" y="78" width="220" height="84" rx="9" fill="#dbeafe" stroke="#5b8dd9" stroke-width="1.5"/><text x="42" y="102" font-size="13.5" fill="#1f3a5f" font-weight="700" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">1 · ZIP entpacken</text><text x="42" y="122" font-size="11.5" fill="#374151" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Ordner ICST_Ambi_Reaper an</text><text x="42" y="137" font-size="11.5" fill="#374151" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">festen Ort (SSD, ~/Music)</text><line x1="250" y1="120" x2="279" y2="120" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/><rect x="280" y="78" width="220" height="84" rx="9" fill="#dbeafe" stroke="#5b8dd9" stroke-width="1.5"/><text x="292" y="102" font-size="13.5" fill="#1f3a5f" font-weight="700" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">2 · REAPER.app ergänzen</text><text x="292" y="122" font-size="11.5" fill="#374151" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">in den Ordner, neben</text><text x="292" y="137" font-size="11.5" fill="#374151" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">reaper.ini</text><line x1="500" y1="120" x2="529" y2="120" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/><rect x="530" y="78" width="220" height="84" rx="9" fill="#dbeafe" stroke="#5b8dd9" stroke-width="1.5"/><text x="542" y="102" font-size="13.5" fill="#1f3a5f" font-weight="700" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">3 · Setup-Skript</text><text x="542" y="122" font-size="11.5" fill="#374151" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">run-me-before-install.command,</text><text x="542" y="137" font-size="11.5" fill="#374151" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">beim 1. Mal «Dennoch öffnen»</text><rect x="30" y="222" width="220" height="84" rx="9" fill="#d1fae5" stroke="#3f9b7a" stroke-width="1.5"/><text x="42" y="246" font-size="13.5" fill="#14532d" font-weight="700" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">4 · Start-Skript</text><text x="42" y="266" font-size="11.5" fill="#374151" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">ICST_Ambi_Reaper</text><text x="42" y="281" font-size="11.5" fill="#374151" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">starten.command</text><line x1="250" y1="264" x2="279" y2="264" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/><rect x="280" y="222" width="220" height="84" rx="9" fill="#d1fae5" stroke="#3f9b7a" stroke-width="1.5"/><text x="292" y="246" font-size="13.5" fill="#14532d" font-weight="700" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">5 · Scan-Frage von REAPER?</text><text x="292" y="266" font-size="11.5" fill="#374151" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">mit «No» antworten</text><line x1="500" y1="264" x2="529" y2="264" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/><rect x="530" y="222" width="220" height="84" rx="9" fill="#d1fae5" stroke="#3f9b7a" stroke-width="1.5"/><text x="542" y="246" font-size="13.5" fill="#14532d" font-weight="700" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">6 · Fertig</text><text x="542" y="266" font-size="11.5" fill="#374151" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Pfad endet auf Effects/VST3,</text><text x="542" y="281" font-size="11.5" fill="#374151" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Toolbar ICST_Ambi_Automation</text><text x="542" y="296" font-size="11.5" fill="#374151" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">oben</text><text x="390" y="342" font-size="12" fill="#6b7280" font-weight="400" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Nach der Einrichtung brauchst du nur noch Schritt 4 bis 6.</text></svg>