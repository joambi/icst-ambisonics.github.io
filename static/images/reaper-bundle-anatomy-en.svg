<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 456" role="img"><title>Anatomy of the bundle folder</title><desc>The ICST_Ambi_Reaper folder holds configuration, scripts, plugins, docs and the Animator. You add REAPER.app next to reaper.ini. Two .command files set up and start.</desc><defs><marker id="ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#6b7280"/></marker></defs><rect width="780" height="456" rx="12" fill="#f9fafb"/><text x="390.0" y="28" font-size="15" fill="#374151" font-weight="700" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Anatomy of the bundle folder</text><rect x="20" y="46" width="740" height="394" rx="12" fill="#fff" stroke="#2e5f9a" stroke-width="2"/><path d="M20 58 a12 12 0 0 1 12 -12 h150 l16 14 h-178z" fill="#2e5f9a"/><text x="105" y="57" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif">ICST_Ambi_Reaper/</text><text x="40" y="86" font-size="12" fill="#2e5f9a" font-weight="700" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Included</text><rect x="40" y="96" width="385" height="40" rx="8" fill="#dbeafe" stroke="#5b8dd9" stroke-width="1.4"/><text x="54" y="113" font-size="13" fill="#1f3a5f" font-weight="700" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">reaper.ini, reaper-kb.ini …</text><text x="54" y="129" font-size="11.5" fill="#374151" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">settings, key bindings, menus</text><rect x="40" y="143" width="385" height="40" rx="8" fill="#dbeafe" stroke="#5b8dd9" stroke-width="1.4"/><text x="54" y="160" font-size="13" fill="#1f3a5f" font-weight="700" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Scripts/ICST</text><text x="54" y="176" font-size="11.5" fill="#374151" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Lua scripts (Quick Start, Motion Map …)</text><rect x="40" y="190" width="385" height="40" rx="8" fill="#dbeafe" stroke="#5b8dd9" stroke-width="1.4"/><text x="54" y="207" font-size="13" fill="#1f3a5f" font-weight="700" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Effects/VST3</text><text x="54" y="223" font-size="11.5" fill="#374151" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">ICST and IEM plugins</text><rect x="40" y="237" width="385" height="40" rx="8" fill="#dbeafe" stroke="#5b8dd9" stroke-width="1.4"/><text x="54" y="254" font-size="13" fill="#1f3a5f" font-weight="700" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">UserPlugins</text><text x="54" y="270" font-size="11.5" fill="#374151" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">SWS, js_ReaScriptAPI, ReaPack</text><rect x="40" y="284" width="385" height="40" rx="8" fill="#dbeafe" stroke="#5b8dd9" stroke-width="1.4"/><text x="54" y="301" font-size="13" fill="#1f3a5f" font-weight="700" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Data/toolbar_icons</text><text x="54" y="317" font-size="11.5" fill="#374151" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">toolbar icons</text><rect x="40" y="331" width="385" height="40" rx="8" fill="#dbeafe" stroke="#5b8dd9" stroke-width="1.4"/><text x="54" y="348" font-size="13" fill="#1f3a5f" font-weight="700" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Docs/</text><text x="54" y="364" font-size="11.5" fill="#374151" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">offline manual (index.html)</text><rect x="40" y="378" width="385" height="40" rx="8" fill="#dbeafe" stroke="#5b8dd9" stroke-width="1.4"/><text x="54" y="395" font-size="13" fill="#1f3a5f" font-weight="700" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Animator/</text><text x="54" y="411" font-size="11.5" fill="#374151" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Animator Choreographer</text><text x="455" y="86" font-size="12" fill="#d97706" font-weight="700" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">You add / you run</text><rect x="455" y="96" width="290" height="62" rx="9" fill="#fff7ed" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4"/><text x="470" y="119" font-size="14" fill="#d97706" font-weight="700" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">REAPER.app</text><text x="470" y="138" font-size="11.5" fill="#374151" font-weight="400" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif">download from reaper.fm, next to reaper.ini</text><line x1="455" y1="117" x2="424" y2="117" stroke="#d97706" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ah)"/><rect x="455" y="176" width="290" height="70" rx="9" fill="#3f9b7a" stroke="#2a6f56" stroke-width="1.6"/><text x="600.0" y="200.0" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif">run-me-before-install.command</text><text x="600.0" y="216.0" font-size="12" font-weight="400" fill="#fff" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif">first time only</text><text x="600.0" y="232.0" font-size="12" font-weight="400" fill="#fff" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif">removes quarantine, sets plugin path</text><rect x="455" y="262" width="290" height="70" rx="9" fill="#1f3a5f" stroke="#1f3a5f" stroke-width="1.6"/><text x="600.0" y="286.0" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif">ICST_Ambi_Reaper starten.command</text><text x="600.0" y="302.0" font-size="12" font-weight="400" fill="#fff" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif">use it every time to start</text><text x="600.0" y="318.0" font-size="12" font-weight="400" fill="#fff" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif">sets plugin path, starts REAPER.app</text><text x="600" y="360" font-size="12" fill="#6b7280" font-weight="400" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Everything in one folder – so it stays portable</text><text x="600" y="378" font-size="12" fill="#6b7280" font-weight="400" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif">(e.g. on an external SSD)</text></svg>