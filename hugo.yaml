baseURL = 'https://icst-ambisonics.github.io/'
languageCode = 'en-us'
title = 'The ICST Ambisonics Site'
theme = 'anatole'
eneableEmoji = true

MetaDataFormat = "yaml"
SectionPagesMenu = "main"
Paginate = 3

[sitemap]
  changefreq "monthly"
  priority = 0.5
  filename = "sitemap.xml"


[params]
title = "The ICST Ambisonics"
author = "Johannes Schuett"
singleDateFormat = "2006-01-02"
description = " This is the ICST Ambisonics Tutorial Blog"
profilePicture = "images/AmbiPlugin_logo.gif"
mainSections = ["blog"]
favicon = "favicons/"

[module]
  [[module.mounts]]
    source = 'content'
    target = 'content'
  [[module.mounts]]
    source = 'static'
    target = 'static'
  [[module.mounts]]
    source = 'layouts'
    target = 'layouts'
  [[module.mounts]]
    source = 'data'
    target = 'data'
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    source = 'i18n'
    target = 'i18n'
  [[module.mounts]]
    source = 'archetypes'
    target = 'archetypes'
    
    
## Social links
# use 'fab' when brand icons, use 'fas' when standard solid icons.
[[params.socialIcons]]
icon = "fab fa-github"
title = "GitHub"
url = "https://github.com/jschuett"

