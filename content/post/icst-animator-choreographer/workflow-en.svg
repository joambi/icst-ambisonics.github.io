<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 930" width="1600" height="930" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a4f5c"/></marker></defs>
<rect width="1600" height="930" fill="#fbfaf7"/>
<text x="40" y="56" font-size="30" font-weight="700" fill="#1d1f26">Animator Choreographer · Workflow</text>
<text x="40" y="86" font-size="17" fill="#6b7080">From the REAPER timeline to the Animator and back</text>
<rect x="30" y="110" width="1540" height="190" rx="18" fill="#eef1f6"/>
<text x="52" y="140" font-size="15" font-weight="700" letter-spacing="1.5" fill="#6b7080">REAPER</text>
<rect x="30" y="320" width="1540" height="350" rx="18" fill="#fbf1de"/>
<text x="52" y="350" font-size="15" font-weight="700" letter-spacing="1.5" fill="#6b7080">ANIMATOR CHOREOGRAPHER</text>
<rect x="30" y="690" width="1540" height="200" rx="18" fill="#e6f2ef"/>
<text x="52" y="720" font-size="15" font-weight="700" letter-spacing="1.5" fill="#6b7080">ANIMATOR + ENCODER</text>
<rect x="200" y="150" width="380" height="100" rx="12" fill="#ffffff" stroke="#9aa3b5" stroke-width="2"/>
<text x="390.0" y="180" font-size="19" font-weight="700" text-anchor="middle" fill="#1d1f26">Regions and markers</text>
<text x="390.0" y="206" font-size="14.5" text-anchor="middle" fill="#3b3f4c">One region per section</text>
<text x="390.0" y="228" font-size="14.5" text-anchor="middle" fill="#3b3f4c">of the form (named)</text>
<rect x="720" y="150" width="520" height="100" rx="12" fill="#ffffff" stroke="#9aa3b5" stroke-width="2"/>
<text x="980.0" y="180" font-size="19" font-weight="700" text-anchor="middle" fill="#1d1f26">Lua script</text>
<text x="980.0" y="206" font-size="14.5" text-anchor="middle" fill="#3b3f4c">Animator_export_regions_markers.lua</text>
<text x="980.0" y="228" font-size="14.5" text-anchor="middle" fill="#3b3f4c">writes Animator_&lt;project&gt;_regions_markers.csv</text>
<path d="M580,200 L718,200" fill="none" stroke="#4a4f5c" stroke-width="2.4"  marker-end="url(#ar)"/>
<text x="596" y="222" font-size="13" font-style="italic" fill="#6b7080">time and names</text>
<rect x="120" y="360" width="360" height="100" rx="12" fill="#fffdf8" stroke="#d99a2b" stroke-width="2"/>
<text x="300.0" y="390" font-size="19" font-weight="700" text-anchor="middle" fill="#1d1f26">Load template</text>
<text x="300.0" y="416" font-size="14.5" text-anchor="middle" fill="#3b3f4c">Canon, Mirror duet, Explosion, …</text>
<rect x="580" y="360" width="380" height="100" rx="12" fill="#fffdf8" stroke="#d99a2b" stroke-width="2"/>
<text x="770.0" y="390" font-size="19" font-weight="700" text-anchor="middle" fill="#1d1f26">Import regions (CSV)</text>
<text x="770.0" y="416" font-size="14.5" text-anchor="middle" fill="#3b3f4c">Regions become sections,</text>
<text x="770.0" y="438" font-size="14.5" text-anchor="middle" fill="#3b3f4c">gaps become "(gap)"</text>
<rect x="1060" y="360" width="360" height="100" rx="12" fill="#fffdf8" stroke="#d99a2b" stroke-width="2"/>
<text x="1240.0" y="390" font-size="19" font-weight="700" text-anchor="middle" fill="#1d1f26">Describe</text>
<text x="1240.0" y="416" font-size="14.5" text-anchor="middle" fill="#3b3f4c">Ollama model or "Without AI (rules)"</text>
<text x="1240.0" y="438" font-size="14.5" text-anchor="middle" fill="#3b3f4c">German and English</text>
<path d="M980,250 L980,300 L770,300 L770,358" fill="none" stroke="#4a4f5c" stroke-width="2.4"  marker-end="url(#ar)"/>
<text x="860" y="292" font-size="13" font-style="italic" fill="#6b7080">sections</text>
<rect x="240" y="530" width="820" height="120" rx="12" fill="#fffdf8" stroke="#d99a2b" stroke-width="2"/>
<text x="650.0" y="560" font-size="19" font-weight="700" text-anchor="middle" fill="#1d1f26">Plan · five steps</text>
<text x="650.0" y="586" font-size="14.5" text-anchor="middle" fill="#3b3f4c">1 Form · 2 Groups · 3 Gestures · 4 Relations · 5 Review &amp; Export</text>
<text x="650.0" y="608" font-size="14.5" text-anchor="middle" fill="#3b3f4c">Form: Scaling factor · Base stretch · Max distance · Encoder name</text>
<text x="650.0" y="630" font-size="14.5" text-anchor="middle" fill="#3b3f4c">Review: errors, notices, scale factor</text>
<path d="M300,460 L300,528" fill="none" stroke="#4a4f5c" stroke-width="2.4"  marker-end="url(#ar)"/>
<path d="M770,460 L770,528" fill="none" stroke="#4a4f5c" stroke-width="2.4"  marker-end="url(#ar)"/>
<path d="M1240,460 L1240,495 L1000,495 L1000,528" fill="none" stroke="#4a4f5c" stroke-width="2.4"  marker-end="url(#ar)"/>
<rect x="1160" y="540" width="380" height="100" rx="12" fill="#fffdf8" stroke="#d99a2b" stroke-width="2"/>
<text x="1350.0" y="570" font-size="19" font-weight="700" text-anchor="middle" fill="#1d1f26">Export XML</text>
<text x="1350.0" y="596" font-size="14.5" text-anchor="middle" fill="#3b3f4c">Title_Encoder_01.xml</text>
<text x="1350.0" y="618" font-size="14.5" text-anchor="middle" fill="#3b3f4c">scaled to the max distance</text>
<path d="M1060,590 L1158,590" fill="none" stroke="#4a4f5c" stroke-width="2.4"  marker-end="url(#ar)"/>
<rect x="1160" y="740" width="380" height="100" rx="12" fill="#ffffff" stroke="#3f9d8a" stroke-width="2"/>
<text x="1350.0" y="770" font-size="19" font-weight="700" text-anchor="middle" fill="#1d1f26">Import Scene…</text>
<text x="1350.0" y="796" font-size="14.5" text-anchor="middle" fill="#3b3f4c">Insert at Cursor (start of first region)</text>
<text x="1350.0" y="818" font-size="14.5" text-anchor="middle" fill="#3b3f4c">or Replace · Rescale if asked</text>
<rect x="700" y="740" width="400" height="100" rx="12" fill="#ffffff" stroke="#3f9d8a" stroke-width="2"/>
<text x="900.0" y="770" font-size="19" font-weight="700" text-anchor="middle" fill="#1d1f26">Playback</text>
<text x="900.0" y="796" font-size="14.5" text-anchor="middle" fill="#3b3f4c">REAPER transport drives the Animator</text>
<text x="900.0" y="818" font-size="14.5" text-anchor="middle" fill="#3b3f4c">Play · Pause · Loop</text>
<rect x="240" y="740" width="400" height="100" rx="12" fill="#ffffff" stroke="#3f9d8a" stroke-width="2"/>
<text x="440.0" y="770" font-size="19" font-weight="700" text-anchor="middle" fill="#1d1f26">Reset width (optional)</text>
<text x="440.0" y="796" font-size="14.5" text-anchor="middle" fill="#3b3f4c">Template "Reset width (Encoder)"</text>
<text x="440.0" y="818" font-size="14.5" text-anchor="middle" fill="#3b3f4c">sets Stretch back to Base stretch</text>
<path d="M1350,640 L1350,738" fill="none" stroke="#4a4f5c" stroke-width="2.4"  marker-end="url(#ar)"/>
<text x="1362" y="696" font-size="13" font-style="italic" fill="#6b7080">scene file</text>
<path d="M1158,790 L1102,790" fill="none" stroke="#4a4f5c" stroke-width="2.4"  marker-end="url(#ar)"/>
<path d="M698,790 L642,790" fill="none" stroke="#4a4f5c" stroke-width="2.4" stroke-dasharray="7 6" marker-end="url(#ar)"/>
<text x="612" y="730" font-size="13" font-style="italic" fill="#6b7080">after the scene</text>
